<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MT5 Quant HUD Portal</title>
  <script>
    const ts = Date.now();
    const session = localStorage.getItem('mt5_active_session');
    if (session) {
      window.location.replace('./client/index.html?v=' + ts);
    } else {
      window.location.replace('./client/login.html?v=' + ts);
    }
  </script>
</head>
<body style="background-color: #070a12; color: #94a3b8; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <div style="text-align: center;">
    <h2 style="color: #06b6d4; font-size: 20px; font-weight: 800; letter-spacing: 1px; margin-bottom: 8px;">MT5 QUANT HUD PORTAL</h2>
    <p style="font-size: 13px; color: #64748b;">Iniciando terminal y verificando sesión...</p>
  </div>
</body>
</html>
